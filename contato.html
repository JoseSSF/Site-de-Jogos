<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de contato com formulário para mensagens.">
    <title>Contato - Recomendações de Jogos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imagens/Icones/computer-game.ico" type="image/x-icon">
</head>
<body class="contato">
    <header>
        <h1>Contato</h1>
    </header>
    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="galeria.html">Galeria</a>
        <a href="contato.html">Contato</a>
    </nav>
    <main>
        <h2>Envie uma mensagem</h2>
        <form id="contactForm">
            <label for="name">Nome:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="message">Mensagem:</label><br>
            <textarea id="message" name="message" rows="5" required></textarea><br><br>

            <button type="submit">Enviar</button>
        </form>
        <p id="feedback"></p>
    </main>
    <button id="topBtn" title="Voltar ao topo">↑</button>

    <script src="script.js"></script>
</body>

<footer>
  <nav class="footer-nav">
    <a href="https://github.com/JoseSSF" target="_blank">GitHub</a>
    <a href="https://www.instagram.com/jose.ssf27/" target="_blank">Instagram</a>
  </nav>
</footer>

</html>
